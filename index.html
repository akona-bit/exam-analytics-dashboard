    <!-- Initial Body and Loader CSS (Runs before any external JS or CSS downloads) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #f8fafc;
        color: #1e293b;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .initial-bg-wrap {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }
      /* Nền tối giản: gradient lam nhạt + 2 quầng sáng mờ (khớp SkyBackground) */
      .initial-bg-base {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f9 45%, #e7ecf6 100%);
      }
      .initial-bg-glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 55% at 15% 0%, rgba(99,102,241,0.10) 0%, rgba(99,102,241,0) 70%),
          radial-gradient(60% 50% at 95% 100%, rgba(14,165,233,0.09) 0%, rgba(14,165,233,0) 70%);
      }
      /* Khi React đã render: gỡ splash + lớp nền ban đầu */
      body.app-ready .initial-bg-wrap,
      body.app-ready .initial-splash {
        display: none !important;
      }
      #root {
        position: relative;
        z-index: 10;
        min-height: 100vh;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes loaderSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes shimmerBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(250%); }
      }
      .initial-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .initial-card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 28px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px -12px rgba(16, 24, 70, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 380px;
        width: 90%;
        box-sizing: border-box;
        animation: loaderPulse 3s ease-in-out infinite;
      }
      .initial-logo-box {
        position: relative;
        margin-bottom: 20px;
      }
      .initial-logo-card {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 12px 28px -6px rgba(40, 50, 110, 0.25), 0 0 0 1px rgba(99, 102, 241, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
      }
      .initial-logo-card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .initial-ring {
        position: absolute;
        inset: -6px;
        border-radius: 28px;
        border: 2px dashed rgba(99, 102, 241, 0.55);
        animation: loaderSpin 12s linear infinite;
        pointer-events: none;
      }
      .initial-title {
        margin: 0 0 6px 0;
        font-size: 18px;
        font-weight: 900;
        color: #1e293b;
        letter-spacing: -0.02em;
      }
      .initial-subtitle {
        margin: 0 0 20px 0;
        font-size: 12.5px;
        color: #64748b;
        font-weight: 500;
      }
      .initial-track {
        width: 100%;
        height: 6px;
        background: #f1f5f9;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }
      .initial-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        animation: shimmerBar 1.8s ease-in-out infinite;
      }
      .initial-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #6366f1;
      }
      .initial-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6366f1;
        animation: loaderPulse 1.2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <!-- Pre-React Background (Matches SkyBackground component seamlessly) -->
    <div class="initial-bg-wrap" aria-hidden="true">
      <div class="initial-bg-base"></div>
      <div class="initial-bg-glow"></div>
    </div>

    <!-- SEO Fallback Content for Crawlers & Non-JS Clients -->
    <noscript>
      <div style="max-width: 680px; margin: 40px auto; padding: 32px; background: #ffffff; color: #1e293b; border-radius: 24px; font-family: sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; border: 1px solid #e2e8f0;">
        <h1 style="color: #1e1b4b; font-size: 24px; margin-bottom: 12px; font-weight: 800;">
          Hệ Thống Tra Cứu Điểm Thi &amp; Phân Tích Kết Quả Khảo Sát
        </h1>
        <p style="font-size: 15px; line-height: 1.6; color: #475569; margin-bottom: 20px;">
          Trang web chính thức hỗ trợ thí sinh tra cứu kết quả khảo sát các môn Toán, Tư duy Khoa học tự nhiên (KHTN), Tiếng Việt và Tiếng Anh. Cung cấp báo cáo phổ điểm chi tiết, điểm chuẩn hoá IRT, điểm Thưởng Phạt và ma trận năng lực theo từng chuyên đề kiến thức.
        </p>
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 14px; padding: 16px; color: #1e40af; font-size: 14px; font-weight: 600;">
          ℹ️ Vui lòng bật JavaScript trên trình duyệt của bạn để sử dụng đầy đủ các tính năng tìm kiếm tên thí sinh, xem bảng điểm chi tiết và xuất phiếu điểm PDF.
        </div>
      </div>
    </noscript>

    <!-- Root Element with Initial Loading Splash Screen -->
    <div id="root">
      <div class="initial-splash">
        <div class="initial-card">
          <div class="initial-logo-box">
            <div class="initial-logo-card">
              <img src="./logo.png" alt="Logo" width="56" height="56" />
            </div>
            <div class="initial-ring"></div>
          </div>
          <h2 class="initial-title">Đang Tải Kết Quả Thi...</h2>
          <p class="initial-subtitle">Hệ thống phân tích năng lực &amp; tra cứu điểm</p>
          <div class="initial-track">
            <div class="initial-bar"></div>
          </div>
          <div class="initial-status">
            <span class="initial-dot"></span>
            <span>Đang chuẩn bị dữ liệu kỳ thi</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Gỡ splash/nền ban đầu ngay khi React render xong (xem main.tsx).
      new MutationObserver(function (muts, obs) {
        var root = document.getElementById('root');
        if (root && root.getAttribute('data-ready') === '1') {
          document.body.classList.add('app-ready');
          obs.disconnect();
        }
      }).observe(document.body, { attributes: true, subtree: true, attributeFilter: ['data-ready'] });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Unregister any existing service workers to remove PWA cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered successfully');
          }
        });
      }
    </script>
  </body>
