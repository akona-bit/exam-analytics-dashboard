    <!-- Initial Body and Loader CSS (Runs before any external JS or CSS downloads) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #161a3f;
        background: radial-gradient(circle at 50% 20%, #252b66 0%, #161a3f 70%, #0e112b 100%);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes loaderSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .initial-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        position: relative;
        z-index: 10;
      }
      .initial-logo-box {
        position: relative;
        margin-bottom: 22px;
        animation: loaderPulse 2.4s ease-in-out infinite;
      }
      .initial-logo-card {
        width: 84px;
        height: 84px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 16px 40px -8px rgba(16, 20, 60, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        box-sizing: border-box;
      }
      .initial-logo-card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .initial-ring {
        position: absolute;
        inset: -6px;
        border-radius: 32px;
        border: 2px dashed rgba(165, 180, 252, 0.5);
        animation: loaderSpin 14s linear infinite;
        pointer-events: none;
      }
      .initial-title {
        margin: 0 0 8px 0;
        font-size: 19px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      }
      .initial-subtitle {
        margin: 0 0 24px 0;
        font-size: 13px;
        color: #c7d2fe;
        font-weight: 500;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #818cf8;
        border-right-color: #c084fc;
        animation: loaderSpin 0.85s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
    </style>
  </head>
  <body>
    <!-- SEO Fallback Content for Crawlers & Non-JS Clients -->
    <noscript>
      <div style="max-width: 680px; margin: 40px auto; padding: 32px; background: #ffffff; color: #1e293b; border-radius: 24px; font-family: sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; border: 1px solid #e2e8f0;">
        <h1 style="color: #1e1b4b; font-size: 24px; margin-bottom: 12px; font-weight: 800;">
          Hệ Thống Tra Cứu Điểm Thi &amp; Phân Tích Kết Quả Khảo Sát
        </h1>
        <p style="font-size: 15px; line-height: 1.6; color: #475569; margin-bottom: 20px;">
          Trang web chính thức hỗ trợ thí sinh tra cứu kết quả khảo sát các môn Toán, Tư duy Khoa học tự nhiên (KHTN), Tiếng Việt và Tiếng Anh. Cung cấp báo cáo phổ điểm chi tiết, điểm chuẩn hoá IRT, điểm Thưởng Phạt và ma trận năng lực theo từng chuyên đề kiến thức.
        </p>
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 14px; padding: 16px; color: #1e40af; font-size: 14px; font-weight: 600;">
          ℹ️ Vui lòng bật JavaScript trên trình duyệt của bạn để sử dụng đầy đủ các tính năng tìm kiếm tên thí sinh, xem bảng điểm chi tiết và xuất phiếu điểm PDF.
        </div>
      </div>
    </noscript>

    <!-- Root Element with Initial Loading Splash Screen -->
    <div id="root">
      <div class="initial-splash">
        <div class="initial-logo-box">
          <div class="initial-logo-card">
            <img src="/logo.png" alt="Logo" width="60" height="60" />
          </div>
          <div class="initial-ring"></div>
        </div>
        <h2 class="initial-title">Đang tải kết quả thi...</h2>
        <p class="initial-subtitle">Hệ thống phân tích &amp; tra cứu khảo sát</p>
        <div class="initial-spinner"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Unregister any existing service workers to remove PWA cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered successfully');
          }
        });
      }
    </script>
